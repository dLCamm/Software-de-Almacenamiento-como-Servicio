<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <title>Kubo · Tu almacenamiento en la nube</title>
    <meta name="description" content="Kubo: guarda, organiza y comparte tus archivos en la nube." />
    <meta name="theme-color" content="#5b4fd6" />
    <script>
      // Aplica el tema guardado antes de pintar la página (evita un parpadeo del tema equivocado).
      (function () {
        var theme
        try { theme = localStorage.getItem('kubo-theme') } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        }
        document.documentElement.setAttribute('data-theme', theme)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
