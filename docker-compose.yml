
services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: vaultdrive-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
    stdin_open: true
    tty: true



  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: vaultdrive-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    environment:
      - MINIO_ENDPOINT=minio:9000
    depends_on:
      - minio

  trash-cleanup:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: vaultdrive-trash-cleanup
    command:
      - python
      - manage.py
      - purge_expired_trash
      - --loop
      - --interval-seconds
      - "86400"
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    environment:
      - MINIO_ENDPOINT=minio:9000
    depends_on:
      - minio
    restart: unless-stopped

  minio:
    image: bitnamilegacy/minio:latest
    container_name: vaultdrive-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_BROWSER: "on"
    volumes:
      - minio_data:/bitnami/minio/data
    restart: unless-stopped

  minio-init:
    image: bitnamilegacy/minio-client:latest
    container_name: vaultdrive-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until (mc alias set localminio http://minio:9000 minioadmin minioadmin); do
        echo 'Esperando que MinIO esté disponible...';
        sleep 2;
      done;
      mc mb localminio/vaultdrive-storage --ignore-existing;
      echo 'Bucket vaultdrive-storage verificado/creado con éxito.';
      exit 0;
      "

volumes:
  minio_data:
