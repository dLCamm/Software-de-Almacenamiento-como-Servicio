server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Publica los enlaces prefirmados de MinIO usando el mismo origen del front.
    # Se conserva el Host interno incluido en la firma SigV4.
    location ^~ /minio/ {
        proxy_pass http://minio:9000/;
        proxy_set_header Host minio:9000;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Soporte para rutas de React Router (SPA fallback)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache para archivos estaticos generados por Vite
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
