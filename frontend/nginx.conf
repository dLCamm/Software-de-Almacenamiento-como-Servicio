server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Mismo límite que el backend (100 MB por archivo).
    client_max_body_size 100m;

    # API de Django: el navegador la llama en el mismo origen, sin CORS.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering off;
    }

    # Publica los enlaces prefirmados de MinIO usando el mismo origen del front.
    # Se conserva el Host interno incluido en la firma SigV4.
    location ^~ /minio/ {
        proxy_pass http://minio:9000/;
        proxy_set_header Host minio:9000;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cache para archivos estaticos generados por Vite
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Soporte para rutas de React Router (SPA fallback)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
